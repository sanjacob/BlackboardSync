name: Pytest

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tlambert03/setup-qt-libs@v1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install XVFB for gui testing
        run: sudo apt-get install xvfb

      - name: Install requirements
        run: uv sync --locked --group test --group lint

      - name: Run linter
        run: |
          uv run --no-sync flake8 blackboard_sync/qt
          uv run --no-sync flake8 blackboard_sync/content

      - name: Run type checker
        run: uv run --no-sync mypy --strict blackboard_sync/qt

      - name: Run test suite
        run: uv run --no-sync pytest -vvvv
