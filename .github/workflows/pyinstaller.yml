name: Pytest

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      runs-on:
        required: true
        type: string

jobs:
  pyinstaller:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install current package
        run: uv sync --locked --no-editable --no-default-groups --group package

      - name: Run PyInstaller
        run: "uv run --no-sync pyinstaller BlackboardSync.spec --noconfirm --clean"

      - name: Compress macOS build
        if: startsWith(inputs.runs-on, 'macos')
        run: "tar -czvf build.tar dist/*.app"

      - name: Compress windows build
        if: startsWith(inputs.runs-on, 'windows')
        run: "tar -czvf build.tar dist/*"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('build-{0}', inputs.runs-on) }}
          path: build.tar
