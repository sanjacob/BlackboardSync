[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboardsync"
dynamic = ["version"]
authors = [
  { name="Jacob Sánchez", email="jacobszpz@protonmail.com" },
]
description = "Sync your blackboard content to your device"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Education"
]
dependencies = [
    "pyqt6>=6.7.1",
    "pyqt6-webengine>=6.7.0",
    "beautifulsoup4>=4.12.2",
    "pydantic>=2.1.1",
    "pathvalidate>=3.1.0",
    "python-dateutil==3.0.0",
    "appdirs==1.4.4",
    "lxml>=4.7.1",
    "requests>=2.25.0",
    "packaging>=23.1",
    "bblearn>=0.3.0",
    "whoisit",
    "bwfilters"
]

[project.scripts]
blackboardsync = "blackboard_sync:__main__.main"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-mock>=3.17.0",
    "pytest-xvfb>=3.0.0",
    "hypothesis>=6.170.9",
    "coverage>=7.17.0",
]
lint = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "types-appdirs>=1.4.3.5",
    "types-python-dateutil>=2.9.0.20261021",
    "tiny-api-client>=1.4.0",  # provides the tiny_api_client.mypy plugin
]
docs = [
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
    "recommonmark>=0.7.1",
]
package = [
    "pyinstaller>=6.21.0",
    "pillow>=13.0.0",  # icon conversion for macOS builds
    "build>=1.6.1",
    "twine>=6.2.0",
]

[tool.uv]
default-groups = "all"

[project.urls]
"Homepage" = "https://bbsync.app"
"Repository" = "https://github.com/sanjacob/BlackboardSync"
"Bug Tracker" = "https://github.com/sanjacob/BlackboardSync/issues"

[tool.setuptools_scm]

[tool.setuptools]
packages = [
    "blackboard_sync",
    "blackboard_sync.qt",
    "blackboard_sync.content",
    "blackboard_sync.assets"
]

[tool.mypy]
plugins = ["pydantic.mypy", "tiny_api_client.mypy"]
